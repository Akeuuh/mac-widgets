name: MacWidgets
options:
  bundleIdPrefix: io.github.akeuuh
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: MA2JT9VKAK
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Core:
    path: Core
targets:
  MacWidgets:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: MacWidgetsExtension
      - package: Core
        product: GitHubClient
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mac Widgets
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: App/MacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.github.akeuuh.MacWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.akeuuh.MacWidgets
  MacWidgetsExtension:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: Core
        product: PRCore
      - package: Core
        product: GitHubClient
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Mac Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MacWidgetsExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.github.akeuuh.MacWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.akeuuh.MacWidgets.Widget
